<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="dictionary.png">
    <link rel="stylesheet" href="styles.css">
    <title>Results</title>
</head>

<body>
    <div id="snow"></div>
    <header>
        <a href="index.html">Words</a>
        <a href="grammar.html">Grammar</a>
        <a href="irregular-verbs.html">Verbs</a>
        <a href="test.html">Test</a>
        <a href="name-all-words.html">Guessing game</a>
    </header>
    <div id="mode-block"><button id="mode" value="Night mode">Night mode</button></div>
    <h1>Results</h1>
    <div class="results-box">
        <div id="result-box">
            <table id="result-table">
                <tr>
                    <td class="name">Date</td>
                    <td class="name">Type</td>
                    <td class="name">Result</td>
                </tr>
            </table>
        </div>
        <div>
            <table id="result-table">
                <tr>
                    <td class="name">Day</td>
                    <td class="name">Yes/No</td>
                </tr>
                <tr>
                    <td>Sunday</td>
                    <td id="sun" class="days">No</td>
                </tr>
                <tr>
                    <td>Monday</td>
                    <td id="mon" class="days">No</td>
                </tr>
                <tr>
                    <td>Tueday</td>
                    <td id="tue" class="days">No</td>
                </tr>
                <tr>
                    <td>Wednesday</td>
                    <td id="wed" class="days">No</td>
                </tr>
                <tr>
                    <td>Thursday</td>
                    <td id="thu" class="days">No</td>
                </tr>
                <tr>
                    <td>Friday</td>
                    <td id="fri" class="days">No</td>
                </tr>
                <tr>
                    <td>Saturday</td>
                    <td id="sat" class="days">No</td>
                </tr>
            </table>
        </div>
    </div>
    <p id="senteces-p">Sentences: <span id="sentences">No</span></p>
    <div id="button-box">
        <button id="clear-btn">Clear</button>
    </div>
    <script src="results_script.js"></script>
    <script src="mode-change.js"></script>
</body>

</html>
